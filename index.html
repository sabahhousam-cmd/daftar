<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر ديون محمود ناجي</title>
<meta name="theme-color" content="#0A0909">
<meta name="description" content="دفتر ديون محمود ناجي: الزبائن، الديون والتسديدات، الموافقات، ورسائل الواتساب.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="دفتر الديون">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first ledger app. Black brand bar carrying the wordmark, customers on one ruled sheet, fixed bottom tabs.
   Each statement reads like a ledger leaf: a red margin rule, receipt numbers, and approval stamps. */
:root{
  --paper:#F6F3F3; --ground:#ECE6E7; --sheet:#FFFFFF; --ink:#161314; --muted:#6B6264; --rule:#E5DEDF; --margin:#EEC7C3;
  --brand:#0A0909; --on-brand:#FFFFFF; --on-brand-soft:rgba(255,255,255,.12); --on-brand-line:rgba(255,255,255,.24);
  --debt:#B3241C; --debt-soft:#FBEBE9; --pay:#12744B; --pay-soft:#E4F2EA; --wait:#8F560A; --wait-soft:#FAEFDB;
  --scrim:rgba(12,10,11,.46);
  --shadow:0 1px 2px rgba(22,19,20,.06),0 10px 30px rgba(22,19,20,.10);
  --icon-shadow:0 14px 34px rgba(22,19,20,.28),0 0 0 1px rgba(22,19,20,.06);
  --font-display:"Readex Pro","IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r-md:14px; --r-lg:20px; --col:520px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F0D0E; --ground:#070606; --sheet:#1A1718; --ink:#F3EEEF; --muted:#A99FA1; --rule:#2C2728; --margin:#4D2522;
    --brand:#000000; --on-brand:#FFFFFF; --on-brand-soft:rgba(255,255,255,.1); --on-brand-line:rgba(255,255,255,.2);
    --debt:#FF8E82; --debt-soft:#3A1816; --pay:#5ED39E; --pay-soft:#10291D; --wait:#F1B65A; --wait-soft:#33260F;
    --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px rgba(0,0,0,.5);
    --icon-shadow:0 14px 34px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.14);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.7;align-self:center}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.amt .cur{font-weight:500;font-size:.78em;color:var(--muted);margin-inline-start:4px}
.owe{color:var(--debt)} .cred{color:var(--pay)}
.late-txt{color:var(--debt);font-weight:600}
@media (min-width:600px){ html,body{background:var(--ground)} }

#app{max-width:var(--col);margin-inline:auto;min-height:100vh;background:var(--paper);padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#app.is-login{padding-bottom:24px}
@media (min-width:600px){ #app{border-inline:1px solid var(--rule)} }

.bar{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;min-height:58px}
.bar .logo{height:30px;width:auto;display:block}
.bar-app{font-family:var(--font-display);font-weight:500;font-size:15px;padding-inline-start:12px;border-inline-start:1px solid var(--on-brand-line);white-space:nowrap}
.bar-title{flex:1;min-width:0;font-family:var(--font-display);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:0;background:transparent;color:inherit;cursor:pointer;flex:none}
.bar .iconbtn{background:var(--on-brand-soft)}
.who{display:flex;align-items:center;gap:8px;background:var(--on-brand-soft);border:1px solid var(--on-brand-line);color:var(--on-brand);border-radius:999px;padding:4px 12px 4px 5px;cursor:pointer;max-width:150px;flex:none}
.who-av{width:28px;height:28px;border-radius:50%;background:var(--on-brand);color:var(--brand);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:13px;flex:none}
.who-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0;text-align:start}
.who-txt b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-txt small{font-size:11px;opacity:.72}
.ribbon{display:flex;gap:8px;align-items:center;background:var(--wait-soft);color:var(--wait);font-size:12.5px;line-height:1.45;padding:8px 16px;border-bottom:1px solid var(--rule)}
.ribbon .ic{width:16px;height:16px}

.screen{padding-block:16px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.h1{font-family:var(--font-display);font-weight:600;font-size:25px;line-height:1.25;margin:0;text-wrap:balance}
.today{font-size:13px;color:var(--muted)}
.lead{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-family:var(--font-display);font-weight:600;font-size:17px;margin:0}
.sec-h span{font-size:12.5px;color:var(--muted)}

.notice{display:flex;align-items:center;gap:12px;width:100%;background:var(--ink);color:var(--sheet);border:0;border-radius:var(--r-md);padding:12px 14px;text-align:start;cursor:pointer}
.notice .count{min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--wait);color:var(--sheet);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.notice .txt{flex:1;display:flex;flex-direction:column;line-height:1.35}
.notice .txt small{opacity:.75;font-size:12.5px}
.flip{transform:scaleX(-1)}
.backup{display:flex;align-items:center;gap:12px;background:var(--wait-soft);color:var(--wait);border-radius:var(--r-md);padding:12px 14px}
.backup .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.backup .txt small{font-size:12.5px;opacity:.85}
.backup .btn{min-height:40px;padding:8px 14px;font-size:14px;flex:none}

.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.total .lbl{font-size:12.5px;color:var(--muted)}
.total .val{font-family:var(--font-display);font-size:23px;font-weight:600;color:var(--debt);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total .val small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.meta-line{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:-6px}

.search{display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:0 12px;height:48px;color:var(--muted)}
.search:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:16px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}

.list{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;background:transparent;text-align:start;cursor:pointer}
.row + .row{border-top:1px solid var(--rule)}
.row:active{background:var(--paper)}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--paper);border:1px solid var(--rule);font-family:var(--font-display);font-weight:600;font-size:17px}
.av.lg{width:54px;height:54px;border-radius:16px;font-size:22px}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.row .bal{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;line-height:1.5;white-space:nowrap}
.pill.late{background:var(--debt-soft);color:var(--debt)}
.pill.soon,.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.ok{background:var(--pay-soft);color:var(--pay)}
.pill.off{background:var(--paper);color:var(--muted);border:1px solid var(--rule)}
.cred-l{font-size:12.5px;color:var(--pay);display:inline-flex;gap:4px;align-items:baseline}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);padding:36px 16px;background:var(--sheet);border:1px dashed var(--rule);border-radius:var(--r-md)}
.empty .ic{width:28px;height:28px}
.linkbtn{border:0;background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px;font-weight:600}

.fab{position:fixed;z-index:25;bottom:calc(78px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,calc((100vw - var(--col)) / 2 + 16px));display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--sheet);border:0;border-radius:999px;padding:13px 20px 13px 18px;font-weight:600;box-shadow:var(--shadow);cursor:pointer}
.nav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--col));background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;border:0;background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer}
.tab .ic{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;inset-inline:28%;height:2px;border-radius:2px;background:var(--ink)}
.badge{position:absolute;top:5px;inset-inline-start:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--debt);color:var(--sheet);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

.cust-head{display:flex;align-items:center;gap:14px}
.cust-head .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cust-head .h1{font-size:23px}
.phone-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.phone{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500;user-select:all}
.mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink);text-decoration:none}
.mini .ic{width:15px;height:15px}
.balance{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.balance .k{font-size:13px;color:var(--muted)}
.bal-lines{display:flex;flex-direction:column;gap:2px;font-family:var(--font-display);font-size:30px;line-height:1.2}
.bal-lines .amt{font-weight:600}
.bal-lines .amt .cur{font-size:15px}
.bal-lines .settled{color:var(--pay);font-size:24px;font-weight:600}
.bal-foot{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--rule);padding-top:10px;font-size:13px;color:var(--muted)}
.meter{height:6px;border-radius:999px;background:var(--paper);overflow:hidden;border:1px solid var(--rule)}
.meter i{display:block;height:100%;background:var(--ink);border-radius:999px}
.meter.over i{background:var(--debt)}
.actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:13px;padding:11px 16px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn .ic{width:19px;height:19px}
.btn.grow{flex:1;min-width:0}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--sheet)}
.btn-debt{background:var(--debt);color:var(--sheet)}
.btn-pay,.btn-wa{background:var(--pay);color:var(--sheet)}
.btn-ghost{background:var(--sheet);color:var(--ink);border-color:var(--rule)}
.btn-danger{background:var(--debt);color:var(--sheet)}
.btn-ghost.danger{color:var(--debt)}

.ledger{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden}
.month-h{padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--paper);border-bottom:1px solid var(--rule)}
.ledger .month-h:not(:first-child){border-top:1px solid var(--rule)}
.ent{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:start;width:100%;border:0;background:transparent;text-align:start;cursor:pointer;padding:0}
.ent + .ent{border-top:1px solid var(--rule)}
.ent:active{background:var(--paper)}
.ent .date{display:flex;flex-direction:column;align-items:center;padding:12px 0;border-inline-end:2px solid var(--margin);align-self:stretch;line-height:1.15}
.ent .date b{font-family:var(--font-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.ent .date small{font-size:11px;color:var(--muted)}
.ent .body{display:flex;flex-direction:column;gap:4px;padding:11px 12px;min-width:0}
.what{display:flex;align-items:baseline;gap:8px;min-width:0}
.tl{font-size:12px;font-weight:700;flex:none}
.tl.debt{color:var(--debt)} .tl.pay{color:var(--pay)}
.what .note{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.what .cname{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.no{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stamps{display:flex;gap:6px;flex-wrap:wrap;padding-top:2px}
.stamp{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;padding:0 7px;border-radius:5px;border:1.5px solid currentColor;transform:rotate(-2.5deg);white-space:nowrap}
.stamp.ok{color:var(--pay)} .stamp.wait{color:var(--wait);border-style:dashed} .stamp.rej{color:var(--debt)}
.reason{font-size:12.5px;color:var(--debt)}
.ent .fig{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:11px 14px 11px 12px;font-size:15px}
.run{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ent.is-wait .fig .amt{color:var(--wait)}
.ent.is-rej .fig .amt{color:var(--muted);text-decoration:line-through}
.ent.is-rej .note{color:var(--muted)}

.stack{display:flex;flex-direction:column;gap:12px}
.appr{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden}
.appr-main{display:flex;flex-direction:column;gap:6px;width:100%;padding:14px 14px 12px;border:0;background:transparent;text-align:start;cursor:pointer}
.appr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.appr-top .cname{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appr-amt{font-family:var(--font-display);font-size:24px;line-height:1.2}
.appr-actions{display:flex;gap:8px;padding:0 14px 14px}
.warnbox{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;background:var(--debt-soft);color:var(--debt)}
.warnbox.soft{background:var(--wait-soft);color:var(--wait)}
.warnbox.good{background:var(--pay-soft);color:var(--pay)}
.warnbox .ic{width:17px;height:17px;margin-top:2px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--paper);border:1px solid var(--rule);border-radius:13px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 8px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.seg.type button[data-v="debt"][aria-pressed="true"]{color:var(--debt)}
.seg.type button[data-v="pay"][aria-pressed="true"]{color:var(--pay)}
.cash{background:var(--ink);color:var(--sheet);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:6px}
.cash .k{font-size:13px;opacity:.75}
.cash .v{display:flex;flex-direction:column;font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.cash .v .cur{font-size:14px;margin-inline-start:4px;opacity:.75}
.cash .s{font-size:12.5px;opacity:.75}
.person{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);padding:4px 14px}
.person header{display:flex;align-items:center;gap:10px;padding:10px 0}
.person header b{font-size:15.5px}
.person header .av{width:36px;height:36px;border-radius:11px;font-size:15px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px}
.kv > span:first-child{color:var(--muted)}
.kv .vals{display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:end}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{display:flex;flex-direction:column;font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.note{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:13px;color:var(--muted);line-height:1.55}
.note .ic{width:16px;height:16px;margin-top:3px}

.about{display:flex;align-items:center;gap:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:14px}
.about b{font-family:var(--font-display);font-size:18px;font-weight:600;display:block}
.about small{color:var(--muted);font-size:13px}
.mi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--rule);flex:none}
.mi.danger{color:var(--debt);background:var(--debt-soft);border-color:transparent}
.step{display:flex;flex-direction:column;gap:8px;border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 14px}
.step > b{font-size:15px}
.step > span{font-size:13px;color:var(--muted);line-height:1.55}
.step.done{background:var(--pay-soft);border-color:transparent}
.step.off{opacity:.5}
.day-h{font-size:12.5px;font-weight:600;color:var(--muted);margin:4px 2px -4px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.ev + .ev{border-top:1px solid var(--rule)}
.ev-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--paper);border:1px solid var(--rule);color:var(--muted)}
.ev-ic .ic{width:15px;height:15px}
.ev-ic.approve{background:var(--pay-soft);color:var(--pay);border-color:transparent}
.ev-ic.reject,.ev-ic.delete,.ev-ic.reset{background:var(--debt-soft);color:var(--debt);border-color:transparent}
.ev-ic.create{background:var(--wait-soft);color:var(--wait);border-color:transparent}
.ev-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-body p{margin:0;font-size:14px;line-height:1.5}
.ev-body small{font-size:12px;color:var(--muted)}
.urow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.urow + .urow{border-top:1px solid var(--rule)}
.urow .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.urow .main b{font-size:15.5px}
.urow .main small{font-size:12.5px;color:var(--muted)}
.filepick input{display:none}
.imp-row{display:flex;align-items:center;gap:10px;padding:10px 14px}
.imp-row + .imp-row{border-top:1px solid var(--rule)}
.imp-row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.imp-row .main b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .main small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .bal{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;font-size:14px}
.imp-row.skip{opacity:.5}
.switch{position:relative;width:48px;height:28px;flex:none;border:0;border-radius:999px;background:var(--rule);cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--pay)}
.switch[aria-checked="true"]::after{inset-inline-start:23px}
.perm .kv{font-size:13.5px}
.perm .kv:first-child{border-top:0}
.linkbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;font-size:13.5px}
.linkbox span{flex:1;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.input{width:100%;min-width:0;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;outline:0}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
textarea.input{min-height:84px;resize:vertical}
.amount-row{display:flex;gap:8px;align-items:stretch}
.input.amount{font-family:var(--font-display);font-size:28px;font-weight:600;text-align:center;padding:8px 12px;font-variant-numeric:tabular-nums}
.amount-row .seg{flex:none;grid-auto-flow:row;grid-auto-columns:auto;width:64px}
.amount-row .seg button{padding:6px}
.hint{min-height:20px;font-size:13px;color:var(--muted);text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:var(--col);max-height:92%;display:flex;flex-direction:column;background:var(--sheet);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow);animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:18px 16px 10px}
.sheet-tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sheet-title{font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1.3;margin:0;text-wrap:balance}
.sheet-sub{font-size:13px;color:var(--muted)}
.sheet-head .iconbtn{background:var(--paper);border:1px solid var(--rule)}
.sheet-body{overflow:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;padding:12px 16px 16px;border-top:1px solid var(--rule)}
.sheet .kv:first-child{border-top:0}
.words{display:block;font-size:12px;color:var(--muted);font-weight:400}
.trail .ev{padding:10px 0}
.bubble{background:var(--pay-soft);color:var(--ink);border:1px solid var(--rule);border-radius:16px 16px 16px 5px;padding:12px 14px;white-space:pre-wrap;font-size:14.5px;line-height:1.75;user-select:text;-webkit-user-select:text}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.role{font-size:11.5px;font-weight:600;border:1px solid var(--rule);border-radius:999px;padding:1px 9px;color:var(--muted);white-space:nowrap}
.role.owner{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;max-width:min(calc(100% - 32px),488px);background:var(--ink);color:var(--sheet);border-radius:13px;padding:11px 16px;box-shadow:var(--shadow);font-size:14px;animation:fade .18s ease}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px}

.login{display:flex;flex-direction:column;align-items:center;gap:22px;padding:calc(44px + env(safe-area-inset-top,0px)) 16px 28px}
.app-icon{width:116px;height:116px;border-radius:27px;box-shadow:var(--icon-shadow);display:block;max-width:100%}
.app-icon.sm{width:58px;height:58px;border-radius:14px}
.brandname{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.brandname h1{font-family:var(--font-display);font-weight:600;font-size:30px;margin:0;line-height:1.2}
.brandname span{font-size:14px;color:var(--muted)}
.login .card{width:100%;display:flex;flex-direction:column;gap:14px}
.login .card > p{margin:0;font-size:14.5px;color:var(--muted);text-align:center;text-wrap:balance}
.fineprint{font-size:12.5px;color:var(--muted);text-align:center;margin:0;max-width:40ch}
.boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--muted);font-size:14px}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--rule);border-top-color:var(--ink);animation:spin .8s linear infinite}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.scrim,.sheet,.toast{animation:none}.switch,.switch::after{transition:none}.spin{animation-duration:2.4s}}
.lock{overflow:hidden}
</style>
</head>
<body>
<div id="app"><div class="boot"><img class="app-icon" src="icons/icon-256.png" alt=""><div class="spin" role="status" aria-label="جاري التحميل"></div></div></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">التطبيق يحتاج JavaScript. افتحه من Chrome أو Safari.</p></noscript>
<script>
// If the app's files could not load (first visit without internet), say so instead of spinning forever.
window.__bootFail = function () {
  var off = !navigator.onLine;
  document.getElementById('app').innerHTML = '<section class="login"><img class="app-icon" src="icons/icon-256.png" alt="">' +
    '<div class="brandname"><h1>' + (off ? 'ماكو نت' : 'ما اشتغل التطبيق') + '</h1></div>' +
    '<div class="card"><p>' + (off ? 'أول مرة لازم تفتح التطبيق وانت متصل بالنت، حتى يتجهز يشتغل بدون نت.' : 'تأكد من النت وجرّب مرة ثانية.') + '</p>' +
    '<button class="btn btn-primary block" onclick="location.reload()">حاول مرة ثانية</button></div></section>';
};
</script>
<script type="module" src="app.js" onerror="window.__bootFail()"></script>
</body>
</html>
